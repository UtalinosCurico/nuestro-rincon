<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Observatorio de Nuestro Rincón: un negocio de astroturismo en el norte de Chile, con el cielo de verdad de esta noche.">
<title>Observatorio · Nuestro Rincón</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔭%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carga" id="carga">
  <div class="carga-emo">🔭</div>
  <h1>Observatorio</h1>
  <p>de Nuestro Rincón</p>
  <div class="carga-barra"><i></i></div>
</div>

<header class="hud">
  <button class="hud-volver" id="btnVolver" aria-label="Volver a Nuestro Rincón">‹</button>
  <button class="sitio-chip" id="btnSitio" aria-haspopup="dialog">
    <span aria-hidden="true">📍</span>
    <span class="col" style="gap:0;min-width:0">
      <b id="nomSitio">Valle del Elqui</b>
      <small id="subSitio">Vicuña</small>
    </span>
    <span class="flecha" aria-hidden="true">▾</span>
  </button>
  <div class="hud-stats" aria-live="off">
    <div class="hud-plata" id="valPlata">$0</div>
    <div class="hud-ciencia">🔬 <span id="valCiencia">0</span></div>
  </div>
</header>

<section class="escena" id="escena" aria-label="Vista del observatorio">
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div class="slots" id="slots"></div>
  <div class="chips-escena">
    <span class="chip-e reloj" id="chipReloj"><b>17:00</b> · Día 1</span>
    <span class="chip-e" id="chipCielo">✨ Despejado</span>
    <button class="chip-e alerta oculto" id="chipDecision">💌 Hay algo que decidir</button>
    <button class="chip-e deseo oculto" id="chipDeseo">🌠 ¡Pide un deseo!</button>
  </div>
  <div class="escena-btns">
    <button class="btn-escena" id="btnFiguras" aria-pressed="false" aria-label="Mostrar constelaciones" title="Constelaciones">✦</button>
    <button class="btn-escena vel" id="btnVel" aria-label="Velocidad del tiempo: normal" title="Velocidad del tiempo">×1</button>
  </div>
</section>

<div class="franja" id="franja" aria-label="Esta noche"></div>

<main class="panel" id="panel" tabindex="-1"></main>

<nav class="tabs" role="tablist" aria-label="Secciones">
  <button class="tab activa" role="tab" data-tab="sitio" aria-selected="true"><span>🏕️</span>Sitio</button>
  <button class="tab" role="tab" data-tab="equipo" aria-selected="false"><span>🧭</span>Equipo</button>
  <button class="tab" role="tab" data-tab="ciencia" aria-selected="false"><span>🔬</span>Ciencia</button>
  <button class="tab" role="tab" data-tab="cielo" aria-selected="false"><span>🌌</span>Cielo</button>
  <button class="tab" role="tab" data-tab="metas" aria-selected="false"><span>📖</span>Metas</button>
</nav>

<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-label="Detalle"></div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<button class="informe" id="informe" aria-live="polite"></button>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-caja" id="modalCaja"></div></div>
<canvas id="confeti" aria-hidden="true"></canvas>

<script src="astro.js"></script>
<script src="datos.js"></script>
<script src="motor.js"></script>
<script src="arte.js"></script>
<script src="escena.js"></script>
<script src="vida.js"></script>
<script src="ui.js"></script>
</body>
</html>
